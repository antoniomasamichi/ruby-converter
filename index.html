<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Wordルビ → HTML変換</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 500px;
        margin: 60px auto;
      }
      button {
        padding: 8px 24px;
        font-size: 1em;
        cursor: pointer;
      }
      #status {
        margin-top: 16px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h2>Wordルビ → HTML変換</h2>
    <p>サーバー不要・ブラウザ完結で変換します。</p>

    <input type="file" id="fileInput" accept=".docx" />
    <br /><br />
    <button id="btnConv" disabled>変換する</button>
    <div id="status">読み込み中...</div>

    <script>
      // Moduleを先に定義してからruby_converter.jsを読む
      var Module = {
        onRuntimeInitialized: function () {
          try {
            FS.mkdir("/tmp");
          } catch (e) {}

          document.getElementById("status").textContent =
            "docxファイルを選択してください";

          const input = document.getElementById("fileInput");
          const btn = document.getElementById("btnConv");
          const status = document.getElementById("status");

          input.addEventListener("change", () => {
            btn.disabled = !input.files.length;
          });

          btn.addEventListener("click", async () => {
            const file = input.files[0];
            const buf = await file.arrayBuffer();
            const data = new Uint8Array(buf);

            status.textContent = "変換中...";

            // Wasmメモリに直接コピー
            const ptr_in = _malloc(data.length);
            if (!ptr_in) {
              status.textContent = "エラー: メモリ確保失敗";
              return;
            }
            HEAPU8.set(data, ptr_in);

            // C関数呼び出し
            const ptr_out = _docx_to_html_wasm(ptr_in, data.length);
            _free(ptr_in);

            if (!ptr_out) {
              status.textContent = "エラー: 変換失敗";
              return;
            }

            const html = UTF8ToString(ptr_out);
            _free(ptr_out);

            // ダウンロード
            const blob = new Blob([html], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = file.name.replace(".docx", ".html");
            a.click();
            URL.revokeObjectURL(url);

            status.textContent = "完了！ダウンロードが始まります。";
          });
        },
      };
    </script>

    <!-- Moduleを定義した後に読み込む -->
    <script src="ruby_converter.js"></script>
  </body>
</html>
